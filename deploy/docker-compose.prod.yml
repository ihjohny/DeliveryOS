name: deliveryos-prod

# ==============================================================================
# DeliveryOS — Production Cloud VPS Docker Compose Topology
# ==============================================================================
# Architecture Overview:
#   1. Edge Ingress:     Nginx Reverse Proxy with Let's Encrypt SSL (Ports 80/443)
#   2. Application:      NestJS Production API & React Production SPA
#   3. Data Persistence: PostgreSQL 16 + PostGIS 3.4 & Redis 7.2 In-Memory Cache
# ==============================================================================

services:
  # ============================================================================
  # LAYER 1: PRODUCTION DATA & CACHE INFRASTRUCTURE
  # ============================================================================

  # 1. PostgreSQL 16 with PostGIS 3.4 (Official Image)
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: deliveryos_prod_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-deliveryos}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secretpassword}
    volumes:
      - prod_pgdata:/var/lib/postgresql/data
      - ./init-postgis.sql:/docker-entrypoint-initdb.d/10-postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-deliveryos}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - deliveryos_prod_network

  # 2. Redis 7.2 Cache & Real-Time Pub/Sub
  redis:
    image: redis:7.2-alpine
    container_name: deliveryos_prod_redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispassword}
    volumes:
      - prod_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispassword}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - deliveryos_prod_network

  # ============================================================================
  # LAYER 2: PRODUCTION APPLICATION SERVICES
  # ============================================================================

  # 3. NestJS Production Core Backend API
  backend:
    build:
      context: ../services/backend_api
      dockerfile: Dockerfile
    container_name: deliveryos_prod_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: api/v1
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-secretpassword}@postgres:5432/${DB_NAME:-deliveryos}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispassword}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-deliveryos-jwt-secret-key-32chars-minimum-dev}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - deliveryos_prod_network

  # 4. Super Admin Master Console (React SPA)
  admin_portal:
    build:
      context: ../apps/admin_portal
      dockerfile: Dockerfile
    container_name: deliveryos_prod_admin_portal
    restart: always
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - deliveryos_prod_network

  # 5. Vendor Store & Kitchen Order Console KDS (React SPA)
  vendor_portal:
    build:
      context: ../apps/vendor_portal
      dockerfile: Dockerfile
    container_name: deliveryos_prod_vendor_portal
    restart: always
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - deliveryos_prod_network

  # ============================================================================
  # LAYER 3: PRODUCTION EDGE INGRESS & SSL REVERSE PROXY
  # ============================================================================

  # 6. Production Nginx Reverse Proxy with Let's Encrypt SSL
  nginx:
    image: nginx:1.25-alpine
    container_name: deliveryos_prod_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - backend
      - admin_portal
      - vendor_portal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - deliveryos_prod_network

# ==============================================================================
# PRODUCTION PERSISTENT STORAGE VOLUMES
# ==============================================================================
volumes:
  prod_pgdata:
    name: deliveryos_prod_pgdata
  prod_redisdata:
    name: deliveryos_prod_redisdata
  certbot_conf:
  certbot_www:

# ==============================================================================
# PRODUCTION ISOLATED NETWORK
# ==============================================================================
networks:
  deliveryos_prod_network:
    name: deliveryos_prod_network
    driver: bridge

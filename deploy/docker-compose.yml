name: deliveryos

# ==============================================================================
# DeliveryOS — Local Multi-Container Docker Compose Topology
# ==============================================================================
# Architecture Overview:
#   1. Ingress Layer:    Nginx Edge Reverse Proxy (Port 8080)
#   2. App Layer:        Backend API (Port 4000), Admin Portal (Port 3000) & Vendor Portal (Port 3001)
#   3. Data Layer:       PostgreSQL 16 + PostGIS 3.4 (Port 5433) & Redis 7.2 (Port 6380)
# ==============================================================================

services:
  # ============================================================================
  # LAYER 1: DATA & CACHE INFRASTRUCTURE
  # ============================================================================

  # 1. PostgreSQL 16 with PostGIS 3.4 (Official Image)
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: deliveryos_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-deliveryos}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secretpassword}
    volumes:
      - deliveryos_pgdata:/var/lib/postgresql/data
      - ./init-postgis.sql:/docker-entrypoint-initdb.d/10-postgis.sql:ro
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-deliveryos}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - deliveryos_network

  # 2. Redis 7.2 In-Memory Cache & Real-Time Pub/Sub
  redis:
    image: redis:7.2-alpine
    container_name: deliveryos_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispassword}
    volumes:
      - deliveryos_redisdata:/data
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispassword}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - deliveryos_network

  # ============================================================================
  # LAYER 2: APPLICATION SERVICES
  # ============================================================================

  # 3. NestJS Enterprise Core REST & WebSocket API
  backend:
    build:
      context: ../services/backend_api
      dockerfile: Dockerfile
    container_name: deliveryos_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: api/v1
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-secretpassword}@postgres:5432/${DB_NAME:-deliveryos}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispassword}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-deliveryos-jwt-secret-key-32chars-minimum-dev}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - deliveryos_network

  # 4. Super Admin Master Console (React Vite SPA)
  admin_portal:
    build:
      context: ../apps/admin_portal
      dockerfile: Dockerfile
    container_name: deliveryos_admin_portal
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - deliveryos_network

  # 5. Vendor Store & Kitchen Order Console KDS (React Vite SPA)
  vendor_portal:
    build:
      context: ../apps/vendor_portal
      dockerfile: Dockerfile
    container_name: deliveryos_vendor_portal
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3001:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - deliveryos_network

  # ============================================================================
  # LAYER 3: EDGE INGRESS & REVERSE PROXY
  # ============================================================================

  # 6. Local Nginx Edge Ingress Gateway (Unified Single-Origin Port 8080)
  nginx:
    image: nginx:1.25-alpine
    container_name: deliveryos_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.local.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - admin_portal
      - vendor_portal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - deliveryos_network

# ==============================================================================
# PERSISTENT STORAGE VOLUMES
# ==============================================================================
volumes:
  deliveryos_pgdata:
    name: deliveryos_pgdata
  deliveryos_redisdata:
    name: deliveryos_redisdata

# ==============================================================================
# ISOLATED BRIDGE NETWORK
# ==============================================================================
networks:
  deliveryos_network:
    name: deliveryos_network
    driver: bridge
